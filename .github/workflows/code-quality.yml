name: Code Quality
on:
  push: { paths: ["**.py", "codelint.json"] }
  pull_request: { paths: ["**.py", "codelint.json"] }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npx --yes github:voxServalG/codelint check --json > report.json || true
      - run: |
          errors=$(jq '.errors' report.json)
          if [ "$errors" -gt 0 ]; then
            echo "::error::codelint found $errors errors"
            exit 1
          fi
